# coturn for the WebRTC fallback. Credentials are minted per session by the
# host from the same secret as [turn] secret in gateway.toml (REST API
# scheme: username "<expiry>:<id>", HMAC-SHA1).
use-auth-secret
static-auth-secret=replace-with-the-coturn-static-auth-secret
realm=desk.example.com
listening-port=3478
min-port=49152
max-port=49999
# TURN over TLS (turns:, 5349) needs a certificate coturn can read; the
# gateway keeps its ACME key 0600, so give coturn its own copy if wanted.
fingerprint
no-cli
no-multicast-peers
user-quota=8
total-quota=200
# Never relay into private networks (SSRF through TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
