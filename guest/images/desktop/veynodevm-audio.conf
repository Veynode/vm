# VeynodeVM virtual speakers and microphone. Apple Virtualization gives the
# Guest no sound card VeynodeVM can reach, so the guest agent relays these two
# to the desktop viewer (guest/veynode-agent/desktop_audio_linux.go). Their low
# priority keeps QEMU's sound card (Config::audio) the default when it exists.
# The microphone is a loopback: WirePlumber links no playback stream to a
# source, so the agent plays into its feed sink, and its source is ranked above
# the speakers' monitor, which WirePlumber would otherwise make the default input.
# ubuntu-gnome keeps a copy in its rootfs (its own build context).
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "veynodevm-speakers"
            node.description = "VeynodeVM Speakers"
            media.class      = Audio/Sink
            audio.rate       = 48000
            audio.position   = [ FL FR ]
            priority.driver  = 100
            priority.session = 100
        }
    }
]
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "VeynodeVM Microphone"
            audio.rate       = 48000
            audio.position   = [ MONO ]
            capture.props = {
                node.name        = "veynodevm-microphone-feed"
                node.description = "VeynodeVM Microphone Feed"
                media.class      = Audio/Sink
                priority.driver  = 1
                priority.session = 1
            }
            playback.props = {
                node.name        = "veynodevm-microphone"
                node.description = "VeynodeVM Microphone"
                media.class      = Audio/Source
                priority.session = 110
            }
        }
    }
]
