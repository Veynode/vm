# VeynodeVM: log the image user in without input. Xorg rather than Wayland:
# the session can then be captured with xwd from `veynodevm exec`, and it
# works on both the 2D virtio-gpu scanout (llvmpipe) and virgl.
[daemon]
AutomaticLoginEnable=true
AutomaticLogin=ubuntu
WaylandEnable=false

[security]

[xdmcp]

[chooser]

[debug]
