[package]
name = "vm-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "vm-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tower-http = { version = "0.6", features = ["fs"] }
vm-remote-proto = { path = "../remote-proto" }
wtransport = { version = "0.7", default-features = false }
x509-parser = "0.17"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
