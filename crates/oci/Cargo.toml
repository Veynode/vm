[package]
name = "veynodevm-oci"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "OCI image pull, content-addressed store and squashfs root conversion (plus Tart macOS images) for VeynodeVM"

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
