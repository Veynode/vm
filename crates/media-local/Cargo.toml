[package]
name = "vm-media-local"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
anyhow = "1"
libc = "0.2"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
rtc = "=0.21.0"
webrtc = "=0.21.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "net", "fs"] }
uuid = { version = "1", features = ["v4"] }
vm-session-auth = { path = "../session-auth" }
vm-control = { path = "../control" }
# `desktop.stream` for the remote hub.
veynodevm-api = { path = "../api" }
# Remote desktop host (`vm-media-local remote`): the tunnel to vm-gateway.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
vm-remote-proto = { path = "../remote-proto" }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
tempfile = "3"
# Paused-time tests of the media session cap; adds no crate, only a tokio feature.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
