[package]
name = "veynodevm"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
description = "Docker-like CLI for VeynodeVM micro-VMs and the shared engine"

[[bin]]
name = "veynodevm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veynodevm-api = { path = "../api" }

[dev-dependencies]
tempfile = "3"
