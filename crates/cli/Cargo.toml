[package]
name = "veynodevm"
version = "0.1.0"
edition = "2021"
description = "Docker-like CLI for VeynodeVM micro-VMs and the shared engine"

[[bin]]
name = "veynodevm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vm-control = { path = "../control" }
veynodevm-oci = { path = "../oci" }

[dev-dependencies]
tempfile = "3"
