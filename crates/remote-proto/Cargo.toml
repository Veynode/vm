[package]
name = "vm-remote-proto"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
aws-lc-rs = "1.18"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
