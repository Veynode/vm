[package]
name = "vm-control"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veynodevm-api = { path = "../api" }
veynodevm-mcp = { path = "../mcp" }
veynodevm-oci = { path = "../oci" }

rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal"] }
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3"
# The screenshot path test reads a reply the way the media service does; adds no crate, only a tokio feature.
tokio = { version = "1", features = ["net"] }
